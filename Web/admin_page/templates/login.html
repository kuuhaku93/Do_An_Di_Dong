{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập hệ thống</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      .login-box {
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }
      
      .login-box img {
        width: 300px;
        margin-bottom: 20px;
      }
      
      .login-box h2 {
        margin-bottom: 30px;
        color: #333;
      }
      
      .login-box input[type='text'],
      .login-box input[type='password'] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      
      .login-box button {
        width: 100%;
        padding: 10px;
        background-color: #43b574ff;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .login-box button:hover {
        background-color: #02773fff;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <img src="{% static 'images/Logo.jpg' %}" alt="Logo hệ thống" />
      <h2>Đăng nhập hệ thống</h2>
      <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Tên đăng nhập" required />
        <input type="password" name="password" placeholder="Mật khẩu" required />
        <button type="submit">Đăng nhập</button>
      </form>
      {% comment %} <h2 style="color: #cd0303ff;">{{error}}</h2> {% endcomment %}
    </div>
    
  </body>
</html>
